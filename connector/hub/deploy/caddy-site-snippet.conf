# Site-Block zum Anhängen an einen BESTEHENDEN Caddyfile, wenn Caddy als
# Container läuft und Port 80/443 bereits bedient.
#
# WICHTIG: die auf dem HOST gemountete Datei bearbeiten, nicht die im
# Container. Änderungen im Container gehen beim naechsten `docker compose up`
# verloren. Mountpunkt finden mit:
#
#   docker inspect CADDY-CONTAINER -f '{{json .Mounts}}' | python3 -m json.tool
#
# GATEWAY_IP durch das Gateway des Netzes ersetzen, in dem der
# Caddy-Container haengt (NICHT automatisch 172.17.0.1):
#
#   docker inspect CADDY-CONTAINER \
#     -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{$v.Gateway}}{{"\n"}}{{end}}'
#
# Danach:
#   docker exec CADDY-CONTAINER caddy reload --config /etc/caddy/Caddyfile

hub.DEINE-DOMAIN.de {
	encode zstd gzip

	reverse_proxy GATEWAY_IP:8787 {
		# Long-Poll: der Agent haelt jede Verbindung bis zu 25 s offen.
		# Ohne diese Werte bricht der Proxy vorzeitig ab, die Agenten
		# reconnecten im Dauertakt und das Log fuellt sich mit 504ern.
		transport http {
			read_timeout 120s
			write_timeout 120s
			dial_timeout 15s
		}
	}

	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Content-Type-Options "nosniff"
		-Server
	}

	log {
		output file /var/log/caddy/skconnector.log
		format json
	}
}
