# Alternative zu Caddy: nginx-vhost fuer den Connector-Hub.
#
# Nimm diese Datei, wenn auf dem Server bereits nginx laeuft und Port 80/443
# belegt. Zwei Webserver nebeneinander funktionieren nicht.
#
#   sudo cp nginx-hub.conf /etc/nginx/sites-available/skconnector-hub
#   sudo ln -s /etc/nginx/sites-available/skconnector-hub /etc/nginx/sites-enabled/
#   sudo nano /etc/nginx/sites-available/skconnector-hub    # Hostnamen eintragen
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d hub.DEINE-DOMAIN.de
#
# certbot ergaenzt den TLS-Block selbst. Danach nochmal `sudo nginx -t`.

server {
    listen 80;
    listen [::]:80;
    server_name hub.DEINE-DOMAIN.de;

    # certbot traegt hier nach dem ersten Lauf die Weiterleitung auf 443 ein.

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-Poll: der Agent haelt die Verbindung bis zu 25s offen.
        # Ohne diese Werte bricht nginx nach 60s mit 504 ab und die Agenten
        # bauen die Verbindung staendig neu auf.
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 15s;

        # Antworten nicht puffern - Ergebnisse sollen sofort durchgehen.
        proxy_buffering off;
    }

    # Der Hub ist eine API, keine Website: kein Verzeichnislisting, keine
    # Standardseiten, und die Serverkennung raus.
    server_tokens off;
    access_log /var/log/nginx/skconnector-hub.access.log;
    error_log  /var/log/nginx/skconnector-hub.error.log;
}
